<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrossel Suno</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{
  --bg:#0d0f11; --panel:#16191d; --panel-2:#1d2126; --line:#2a2f36;
  --txt:#e9ecef; --txt-dim:#98a1ab; --accent:#1d9bf0; --accent-2:#0f7fc9;
  --warn:#f0b429; --danger:#e5484d; --ok:#3fbf68;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;height:100vh}
@media (max-width:1000px){.app{grid-template-columns:1fr;height:auto}}

.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.side-body{overflow-y:auto;padding:16px 20px 40px;flex:1;min-height:0}
.side-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;background:var(--panel-2)}

h1{margin:0;font-size:17px;letter-spacing:-.2px}
.sub{margin:4px 0 0;font-size:12.5px;color:var(--txt-dim)}

/* ---------- controls ---------- */
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;cursor:pointer;transition:.12s;font-size:13.5px;line-height:1.2;
}
.btn:hover{border-color:#3d444d;background:#232830}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.tiny{padding:4px 8px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

label.field{display:block;margin:0 0 12px}
label.field > span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt-dim);margin-bottom:5px}
input[type=text],textarea,select{
  width:100%;background:#0f1215;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;outline:none;resize:vertical;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:96px;line-height:1.5;font-size:14px}
select{cursor:pointer}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;color:var(--txt-dim)}
.check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

/* ---------- slide cards ---------- */
.slide-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);margin-bottom:12px;overflow:hidden}
.slide-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slide-head{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#1a1e23;border-bottom:1px solid var(--line);cursor:pointer}
.slide-n{width:22px;height:22px;border-radius:6px;background:#2c323a;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.slide-title{flex:1;font-size:13px;color:var(--txt-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide-body{padding:12px 11px}
.hint{font-size:11.5px;color:var(--txt-dim);margin-top:5px;line-height:1.5}
kbd{background:#2c323a;border-radius:4px;padding:1px 5px;font:600 11px ui-monospace,Menlo,monospace}

.thumb{display:flex;gap:9px;align-items:center;margin-top:8px}
.thumb img{width:56px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#000}

/* ---------- preview ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.main-head{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stage{flex:1;overflow:auto;padding:26px 22px 40px;min-height:0}
.grid{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}

.frame{position:relative;width:288px;flex:none}
.frame canvas{
  width:288px;height:360px;display:block;border-radius:8px;
  border:1px solid var(--line);background:#000;
}
.frame.sel canvas{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,155,240,.35)}
.frame-bar{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--txt-dim)}
.frame-bar .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-of{
  position:absolute;top:8px;left:8px;background:var(--warn);color:#151515;
  font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;
}
.empty{color:var(--txt-dim);font-size:14px;padding:40px 0}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 16px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-head">
      <h1>Gerador de Carrossel</h1>
      <p class="sub">1080&times;1350 &middot; PNG pronto pra postar</p>
    </div>

    <div class="side-body">

      <label class="field">
        <span>Perfil</span>
        <select id="marca">
          <option value="baroni">@ProfessorBaroni</option>
          <option value="suno">@suno</option>
        </select>
      </label>

      <label class="field">
        <span>Colar texto corrido</span>
        <textarea id="bulk" placeholder="Cole aqui o texto inteiro do carrossel.&#10;&#10;A primeira linha vira o t&iacute;tulo da capa.&#10;Par&aacute;grafos separados por linha em branco viram as l&acirc;minas seguintes."></textarea>
      </label>
      <div class="row">
        <button class="btn primary" id="bulk-go">Gerar l&acirc;minas</button>
        <button class="btn ghost" id="bulk-clear">Limpar tudo</button>
      </div>
      <p class="hint" id="brand-hint"></p>

      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

      <div id="slides"></div>
      <button class="btn" id="add" style="width:100%">+ Adicionar l&acirc;mina</button>

      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

      <div id="opt-disc">
        <label class="field">
          <span>Disclaimer</span>
          <input type="text" id="disc" value="&#9888;&#65039; Este conte&uacute;do n&atilde;o &eacute; uma recomenda&ccedil;&atilde;o de investimento.">
        </label>
        <div class="row" style="margin-bottom:8px">
          <label class="check"><input type="checkbox" id="disc-on" checked> Mostrar disclaimer</label>
        </div>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="autofit" checked> Reduzir a fonte quando o texto estourar</label>
      </div>
      <div class="row" id="opt-topalign" style="margin-top:8px">
        <label class="check"><input type="checkbox" id="topalign"> Alinhar corpo no topo (padr&atilde;o: centralizado)</label>
      </div>
    </div>

    <div class="side-foot">
      <button class="btn primary" id="dl-all">Baixar todas (.zip)</button>
      <button class="btn" id="dl-one">Baixar l&acirc;mina atual</button>
      <p class="hint" id="dl-hint" style="width:100%;margin:0"></p>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <strong style="font-size:14px">Pr&eacute;via</strong>
      <span class="sub" id="count">0 l&acirc;minas</span>
      <span style="flex:1"></span>
      <span class="sub" id="fontstat"></span>
    </div>
    <div class="stage"><div class="grid" id="grid"></div></div>
  </main>

</div>

      if (m.index > last) out.push({ text: text.slice(last, m.index), em: false, alt: false });
      var tok = m[0];
      if (tok.slice(0, 2) === '**') out.push({ text: tok.slice(2, -2), em: true, alt: false });
      else out.push({ text: tok.slice(2, -2), em: false, alt: true });
      last = m.index + tok.length;

    if (last < text.length) out.push({ text: text.slice(last), em: false, alt: false });

    function flush() { lines.push({ items: cur, w: curW }); cur = []; curW = 0; }
    runs.forEach(function (run) {

  function cssGrad(ctx, angle, x, y, w, h, stops) {

    stops.forEach(function (s) {

      var dica = MARCAS[marca].dica;
      if (campos.indexOf('title') >= 0) textField('Título', 'title', s.type === 'capa' && marca === 'baroni' ? 'Staatliches 96px, vira caixa alta.' : null, 3);
      if (campos.indexOf('sub') >= 0) textField('Subtítulo', 'sub', null, 2);
      if (campos.indexOf('body') >= 0) textField('Texto', 'body', dica + ' · linha em branco = parágrafo', 5);
      if (campos.indexOf('img') >= 0) imgField(s.type === 'capa' ? 'Imagem de fundo' : 'Imagem');

      card.appendChild(body); host.appendChild(card);
    });
  }

  var canvases = [];
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function draw() {
    var c = cfg(), grid = $('grid');
    $('count').textContent = slides.length + (slides.length === 1 ? ' lâmina' : ' lâminas');
    if (!slides.length) {
      grid.innerHTML = '<p class="empty">Nenhuma lâmina ainda. Cole o texto ao lado e clique em <strong>Gerar lâminas</strong>.</p>';
      canvases = []; return;
    }
    grid.innerHTML = ''; canvases = [];
    slides.forEach(function (s, i) {
      var frame = document.createElement('div');
      frame.className = 'frame' + (i === sel ? ' sel' : '');
      var cv = document.createElement('canvas'); frame.appendChild(cv);
      if (render(cv, marca, s, c)) {
        var b = document.createElement('div'); b.className = 'badge-of';
        b.textContent = 'texto longo demais'; frame.appendChild(b);
      }
      var bar = document.createElement('div'); bar.className = 'frame-bar';
      bar.innerHTML = '<span class="grow"></span>';
      bar.querySelector('.grow').textContent = (i + 1) + '. ' + labelDe(s.type);
      var dl = document.createElement('button'); dl.className = 'btn tiny'; dl.textContent = 'PNG';
      dl.onclick = function () { cv.toBlob(function (b2) { save(b2, pad(i + 1) + '.png'); }, 'image/png'); };
      bar.appendChild(dl); frame.appendChild(bar);
      cv.onclick = function () { sel = i; buildEditor(); draw(); };
      grid.appendChild(frame); canvases.push(cv);
    });
  }

  /* divisao automatica do texto colado */
  function autoSplit(raw) {
    var ctx = document.createElement('canvas').getContext('2d');
    var paras = raw.replace(/\r/g, '').split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (!paras.length) return [];
    var out = [], first = paras.shift().split('\n');
    var capa = blank('capa'); capa.title = first[0] || ''; capa.sub = first.slice(1).join(' ');
    out.push(capa);

    if (marca === 'suno') {
      /* no Suno cada lamina tem titulo proprio: 1a linha do bloco vira titulo */
      paras.forEach(function (p) {
        var ls = p.split('\n'), s = blank('texto');
        s.title = ls[0]; s.body = ls.slice(1).join('\n');
        if (!s.body) { s.body = s.title; s.title = ''; }
        out.push(s);
      });
      return out;
    }
    var t = B.corpo, avail = t.regionBottom - t.regionTop, cur = '';
    paras.forEach(function (p) {
      var test = cur ? cur + '\n\n' + p : p;
      if (cur && layout(ctx, test, t.body).height > avail) {
        var s = blank('corpo'); s.body = cur; out.push(s); cur = p;
      } else cur = test;
    });
    if (cur) { var s2 = blank('corpo'); s2.body = cur; out.push(s2); }
    return out;
  }

  function aplicaMarca() {
    var M = MARCAS[marca];
    $('opt-disc').style.display = M.disclaimer ? '' : 'none';
    $('opt-topalign').style.display = M.topAlign ? '' : 'none';
    $('brand-hint').innerHTML = 'Formatação no texto: ' + M.dica + ' · linha em branco = parágrafo.';
    var validos = Object.keys(tipos());
    slides.forEach(function (s) { if (validos.indexOf(s.type) < 0) s.type = tipoPadrao(); });
    buildEditor(); draw();
  }

  function wire() {
    $('marca').onchange = function () { marca = $('marca').value; aplicaMarca(); };
    $('bulk-go').onclick = function () {
      var raw = $('bulk').value.trim();
      if (!raw) { toast('Cole algum texto primeiro.'); return; }
      slides = autoSplit(raw); sel = 0; buildEditor(); draw();
      toast(slides.length + ' lâminas geradas.');
    };
    /* confirmacao em dois cliques: `confirm()` e bloqueado em iframe sandbox */
    var armado = null;
    $('bulk-clear').onclick = function () {
      var b = $('bulk-clear');
      if (!slides.length) { $('bulk').value = ''; return; }
      if (!armado) {
        b.textContent = 'Confirmar?'; b.classList.add('primary');
        armado = setTimeout(function () {
          armado = null; b.textContent = 'Limpar tudo'; b.classList.remove('primary');
        }, 3500);
        return;
      }
      clearTimeout(armado); armado = null;
      b.textContent = 'Limpar tudo'; b.classList.remove('primary');
      $('bulk').value = ''; slides = []; sel = 0; buildEditor(); draw();
    };
    $('add').onclick = function () { slides.push(blank()); sel = slides.length - 1; buildEditor(); draw(); };
    ['disc', 'disc-on', 'autofit', 'topalign'].forEach(function (id) {
      $(id).addEventListener('input', draw); $(id).addEventListener('change', draw);
    });
    $('dl-one').onclick = function () {
      if (!canvases[sel]) { toast('Nada para baixar.'); return; }
      canvases[sel].toBlob(function (b) { save(b, pad(sel + 1) + '.png'); }, 'image/png');
    };
    $('dl-all').onclick = function () {
      if (!canvases.length) { toast('Nada para baixar.'); return; }
      var pngs = canvases.map(function (cv, i) {
        return new Promise(function (res) {
          cv.toBlob(function (b) { res({ name: pad(i + 1) + '.png', blob: b }); }, 'image/png');
        });
      });
      Promise.all(pngs).then(function (files) {
        return capDownloads.then(function (d) {
          if (!d) {
            return Promise.all(files.map(function (f) {
              return f.blob.arrayBuffer().then(function (ab) {
                return { name: f.name, data: new Uint8Array(ab) };
              });
            })).then(function (entries) {
              saveLocal(zip(entries), 'carrossel-' + marca + '.zip');
              toast(entries.length + ' PNGs no zip.');
            });
          }
          /* um pedido por vez: a capability so mantem um prompt aberto */
          var n = 0;
          return files.reduce(function (chain, f) {
            return chain.then(function (parar) {
              if (parar) return true;
              return save(f.blob, f.name).then(function (r) {
                if (r === 'salvo') { n++; return false; }
                return r === 'recusado';
              });
            });
          }, Promise.resolve(false)).then(function () {
            toast(n + ' de ' + files.length + ' PNGs salvos.');
          });
        });
      });
    };
  }

  bootAssets().then(function () {
    $('fontstat').textContent = HAS_LS ? '' : 'aviso: navegador sem letter-spacing em canvas';
    capDownloads.then(function (d) {
      if (d) {
        $('dl-all').textContent = 'Baixar todas (PNG)';
        $('dl-hint').textContent = 'Cada PNG pede uma confirmação sua.';
      }
    });
    wire(); aplicaMarca();
    window.__render = render; window.__slides = function () { return slides; };
    window.__blank = blank; window.__setMarca = function (m) { marca = m; $('marca').value = m; aplicaMarca(); };
    window.__redraw = draw; window.__ready = true;
  }).catch(function (e) {
    document.body.innerHTML = '<p style="padding:40px;font:16px sans-serif;color:#e5484d">Falha ao carregar fontes/assets: ' + e + '</p>';
  });

})();
</script>
</body>
</html>
