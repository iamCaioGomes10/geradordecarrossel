<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrossel Suno</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-head">
      <h1>Gerador de Carrossel</h1>
      <p class="sub">1080&times;1350 &middot; PNG pronto pra postar</p>
    </div>

    <div class="side-body">

      <label class="field">
        <span>Perfil</span>
        <select id="marca">
          <option value="baroni">@ProfessorBaroni</option>
          <option value="suno">@suno</option>
          <option value="tiago">@tiagogreis</option>
          <option value="noticias">@sunonoticias</option>
          <option value="consultoria">@SunoConsultoria</option>
          <option value="funds">@fundsexplorer</option>
        </select>
      </label>

      <label class="field">
        <span>Colar texto corrido</span>
        <textarea id="bulk" placeholder="Cole aqui o texto inteiro do carrossel.&#10;&#10;A primeira linha vira o t&iacute;tulo da capa.&#10;Par&aacute;grafos separados por linha em branco viram as l&acirc;minas seguintes."></textarea>
      </label>
      <div class="row">
        <button class="btn primary" id="bulk-go">Gerar l&acirc;minas</button>
        <button class="btn ghost" id="bulk-clear">Limpar tudo</button>
      </div>
      <p class="hint" id="brand-hint"></p>

      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

      <div id="slides"></div>
      <button class="btn" id="add" style="width:100%">+ Adicionar l&acirc;mina</button>

      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

      <div id="opt-disc">
        <label class="field">
          <span>Disclaimer</span>
          <input type="text" id="disc" value="&#9888;&#65039; Este conte&uacute;do n&atilde;o &eacute; uma recomenda&ccedil;&atilde;o de investimento.">
        </label>
        <div class="row" style="margin-bottom:8px">
          <label class="check"><input type="checkbox" id="disc-on" checked> Mostrar disclaimer</label>
        </div>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="autofit" checked> Reduzir a fonte quando o texto estourar</label>
      </div>
      <div class="row" id="opt-topalign" style="margin-top:8px">
        <label class="check"><input type="checkbox" id="topalign"> Alinhar corpo no topo (padr&atilde;o: centralizado)</label>
      </div>
    </div>

    <div class="side-foot">
      <button class="btn primary" id="dl-all">Baixar todas (.zip)</button>
      <button class="btn" id="dl-one">Baixar l&acirc;mina atual</button>
      <p class="hint" id="dl-hint" style="width:100%;margin:0"></p>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <strong style="font-size:14px">Pr&eacute;via</strong>
      <span class="sub" id="count">0 l&acirc;minas</span>
      <span style="flex:1"></span>
      <span class="sub" id="fontstat"></span>
    </div>
    <div class="stage"><div class="grid" id="grid"></div></div>
  </main>

</div>
<div class="toast" id="toast"></div>
<script>/*__ASSETS__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
