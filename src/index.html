<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrossel Suno</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="sigla"><i></i><b>Carrossel</b></div>
    <div class="perfis" id="perfis" role="group" aria-label="Perfil"></div>
    <span class="conta mono" id="conta"></span>
    <button class="btn" id="btn-colar">Colar texto</button>
    <button class="btn primary" id="dl-all">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="rot-exportar">Exportar</span>
    </button>
  </div>

  <div class="meio">
    <div class="centro">
      <div class="palco" id="palco"></div>
      <div class="esteira" id="esteira"></div>
    </div>
    <aside class="painel" id="painel"></aside>
  </div>

</div>

<div class="cortina" id="cortina" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="tit-colar">
    <h2 id="tit-colar">Colar texto corrido</h2>
    <p class="dica" id="dica-colar"></p>
    <textarea id="bulk" rows="12" placeholder="Cole aqui o texto inteiro do carrossel.&#10;&#10;A primeira linha vira o t&iacute;tulo da capa.&#10;Par&aacute;grafos separados por linha em branco viram as l&acirc;minas seguintes."></textarea>
    <div class="folha-pe">
      <button class="btn ghost" id="bulk-clear">Limpar tudo</button>
      <span style="flex:1"></span>
      <button class="btn ghost" id="fechar-colar">Cancelar</button>
      <button class="btn primary" id="bulk-go">Gerar l&acirc;minas</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<span class="mono" id="fontstat" hidden></span>
<script>/*__ASSETS__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
