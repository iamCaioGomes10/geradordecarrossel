<title>Mesa de Trabalho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Staatliches&family=Poppins:wght@300;400;600;700&family=Caladea:wght@400;700&family=Montserrat:wght@300;400;600;700&family=Afacad:wght@400;700&family=Instrument+Sans:wght@400;600&display=swap">
<style>
  /* Ferramenta de arte: escuro por escolha, não por omissão — chrome claro
     em volta de lâminas escuras falseia a leitura da própria arte. */
  :root{
    --ground:#0a0b0d; --stage:#0d0e11; --surface:#17191c; --raised:#1f2226;
    --line:#1c1f23; --line-2:#2b2f34;
    --ink:#e8e9ea; --dim:#7e848b; --mute:#565c63;
    --accent:#d42126; --warn:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
  button{cursor:pointer}
  a{color:var(--accent)} a:hover{color:#f0575c}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .app{display:flex; flex-direction:column; height:100vh}

  /* ---------- barra superior ---------- */
  .top{
    height:56px; flex:none; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:22px; padding:0 18px;
  }
  .marca{display:flex; align-items:center; gap:9px; flex:none}
  .marca i{width:9px; height:9px; background:var(--accent); display:block}
  .marca b{font-size:13px; font-weight:600; letter-spacing:.02em}

  .perfis{display:flex; gap:2px; align-items:center; overflow-x:auto; scrollbar-width:none}
  .perfis::-webkit-scrollbar{display:none}
  .perfil{
    display:flex; align-items:center; gap:7px; padding:8px 12px; white-space:nowrap;
    border:1px solid transparent; color:var(--dim); font-size:12.5px; min-height:38px;
  }
  .perfil i{width:7px; height:7px; border-radius:50%; display:block; flex:none}
  .perfil:hover{color:var(--ink)}
  .perfil[aria-pressed="true"]{background:var(--surface); border-color:var(--line-2); color:var(--ink); font-weight:500}

  .conta{margin-left:auto; font-size:11.5px; color:var(--mute); flex:none}
  .exportar{
    display:flex; align-items:center; gap:8px; padding:9px 16px; min-height:38px;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600; flex:none;
  }
  .exportar:hover{background:#ef2f34}

  /* ---------- corpo ---------- */
  .corpo{flex:1; display:flex; min-height:0}
  .centro{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--stage)}

  .palco{
    flex:1; display:flex; align-items:center; justify-content:center; gap:26px;
    padding:26px 30px; min-height:0; overflow:hidden;
  }
  .lam{flex:none; display:flex; flex-direction:column; align-items:flex-start; cursor:pointer}
  .lam .arte{position:relative; overflow:hidden; background:#111}
  .lam .cap{margin-top:9px; font-size:10.5px; color:var(--mute); letter-spacing:.03em}
  .lam[data-foco="1"] .cap{color:var(--accent)}
  .lam[data-foco="0"]{opacity:.72}
  .lam[data-foco="0"]:hover{opacity:.92}
  .lam[data-foco="1"] .arte{outline:2px solid var(--accent); outline-offset:-1px}

  /* elementos clicáveis dentro da arte */
  .alvo{cursor:pointer}
  .alvo:hover{box-shadow:inset 0 0 0 2px rgba(212,33,38,.45)}
  .alvo[data-sel="1"]{box-shadow:inset 0 0 0 2px var(--accent); background:rgba(212,33,38,.06)}
  .selo{
    position:absolute; background:var(--accent); color:#fff; font-weight:600;
    letter-spacing:.04em; z-index:3; pointer-events:none;
  }

  /* ---------- esteira ---------- */
  .esteira{
    height:96px; flex:none; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:0 18px; overflow-x:auto;
  }
  .quadro{
    width:48px; height:60px; flex:none; position:relative; overflow:hidden;
    border:1px solid var(--line-2); background:var(--surface); cursor:pointer; padding:0;
  }
  .quadro[data-foco="1"]{border-color:var(--accent); border-width:2px}
  .quadro .n{
    position:absolute; left:0; top:0; padding:1px 4px; font-size:9px; font-weight:600;
    background:rgba(0,0,0,.55); color:#fff; z-index:2;
  }
  .quadro .fita{position:absolute; inset:0; transform-origin:top left}
  .quadro .alerta{position:absolute; right:2px; bottom:2px; width:11px; height:11px; background:var(--warn); z-index:2}
  .maisq{
    width:48px; height:60px; flex:none; border:1px dashed #33383e; color:var(--dim);
    display:grid; place-items:center;
  }
  .maisq:hover{border-color:var(--accent); color:var(--accent)}

  /* ---------- painel ---------- */
  .painel{
    width:308px; flex:none; border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .pcab{padding:15px 18px; border-bottom:1px solid var(--line)}
  .pcab .k{font-size:10px; color:var(--mute); letter-spacing:.1em}
  .pcab .v{margin-top:5px; font-size:14px; font-weight:500}
  .pbloco{padding:16px 18px; display:flex; flex-direction:column; gap:15px}
  .rot{font-size:10px; color:var(--mute); letter-spacing:.1em; margin-bottom:8px}

  textarea.campo,input.campo{
    width:100%; background:#0f1114; border:1px solid var(--line-2);
    padding:10px 11px; font-size:13.5px; line-height:1.5; resize:vertical;
  }
  textarea.campo:focus,input.campo:focus{border-color:var(--accent); outline:none}
  select.campo{
    width:100%; background:#0f1114; border:1px solid var(--line-2);
    padding:9px 11px; font-size:13.5px; min-height:38px; cursor:pointer;
  }

  .foco-img{height:112px; border:1px solid var(--line-2); position:relative; overflow:hidden; background:#0f1114}
  .foco-img img{position:absolute; max-width:none}
  .foco-img .janela{position:absolute; inset:0; box-shadow:inset 0 0 0 1.5px var(--accent); pointer-events:none}

  .ctrl{display:flex; flex-direction:column; gap:7px}
  .ctrl .lin{display:flex; justify-content:space-between; align-items:baseline}
  .ctrl .lin span:first-child{font-size:12px; color:#a9afb6}
  .ctrl .lin span:last-child{font-size:11.5px}
  .ctrl input[type=range]{width:100%; accent-color:var(--accent); height:20px}
  .ctrl[data-off="1"]{opacity:.4}
  .ctrl[data-off="1"] .lin span:first-child{color:var(--mute)}

  .aviso{display:flex; gap:9px; padding:11px; background:rgba(240,180,41,.08); border-left:2px solid var(--warn)}
  .aviso b{display:block; font-size:12px; color:var(--warn); font-weight:500}
  .aviso p{margin:3px 0 0; font-size:11.5px; color:#8d939a; line-height:1.45}

  .btn-lin{display:flex; gap:8px}
  .btn2{
    flex:1; padding:9px 12px; min-height:38px; border:1px solid var(--line-2);
    background:var(--surface); font-size:12.5px; text-align:center;
  }
  .btn2:hover{border-color:#3d444d; background:var(--raised)}
  .btn2.perigo:hover{border-color:var(--accent); color:#f0575c}
  .vazio{padding:26px 18px; color:var(--mute); font-size:13px; line-height:1.55}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--raised); border:1px solid var(--line-2); padding:10px 16px;
    font-size:13px; opacity:0; pointer-events:none; transition:.18s; z-index:50;
  }
  .toast.on{opacity:1; transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
<div class="app">
  <div class="top">
    <div class="marca"><i></i><b>Carrossel</b></div>
    <div class="perfis" id="perfis" role="group" aria-label="Perfil"></div>
    <span class="conta mono" id="conta"></span>
    <button class="exportar" id="exportar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar
    </button>
  </div>

  <div class="corpo">
    <div class="centro">
      <div class="palco" id="palco"></div>
      <div class="esteira" id="esteira"></div>
    </div>
    <aside class="painel" id="painel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

  /* recorte tipo cover com zoom e ponto focal — o mesmo modelo do app */

  function pintaPalco() {

    var porAlt = p.clientHeight - 52;
    var porLarg = ((p.clientWidth - 60 - 52) / 2.48) / 0.8;
    var altF = Math.max(220, Math.min(porAlt, porLarg, 560));

    [e.foco - 1, e.foco, e.foco + 1].forEach(function (i) {

      p.appendChild(moldura(i, i === e.foco ? altF : altV, i === e.foco));

    });
    var mais = document.createElement("button");
    mais.className = "maisq"; mais.id = "add"; mais.setAttribute("aria-label", "Adicionar lâmina");
    mais.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    el.appendChild(mais);
  }

  /* ---- painel ---- */
  function pintaPainel() {
    var lam = e.laminas[e.foco], m = M[e.marca], f = forma(e.marca, lam.tipo);
    var campos = camposDe(lam.tipo);
    var h = [];

    h.push('<div class="pcab"><div class="k mono">LÂMINA ' + String(e.foco + 1).padStart(2, "0") + "</div>" +
      '<div class="v">' + esc(nomeCampo(e.sel)) + "</div></div>");

    h.push('<div class="pbloco">');
    h.push('<div><div class="rot mono">LAYOUT</div><select class="campo" id="tipo">' +
      chaves(e.marca).map(function (k) {
        return '<option value="' + k + '"' + (k === lam.tipo ? " selected" : "") + ">" + esc(rotulo(e.marca, k)) + "</option>";
      }).join("") + "</select></div>");

    if (m.cab === "numero" && f !== "capa")
      h.push('<div><div class="rot mono">NÚMERO NO CÍRCULO</div><input class="campo" id="num" value="' + esc(lam.n) + '" style="max-width:96px"></div>');

    if (e.sel === "imagem") {
      var im = (f === "capa") ? { w: 1080, h: 1350 } : m.img;
      var g = geo(lam, im.w, im.h), k = 260 / im.w, fg = folga(lam, im.w, im.h);
      h.push('<div><div class="rot mono">ENQUADRAMENTO</div>' +
        '<div class="foco-img">' + (lam.img ?
          '<img src="' + FOTO + '" alt="" style="left:' + (g.x * k) + "px;top:" + (g.y * k * (112 / (im.h * k))) + "px;width:" + (g.w * k) + "px;height:" + (g.h * k * (112 / (im.h * k))) + 'px">' : "") +
        '<div class="janela"></div></div></div>');
      h.push('<div class="ctrl"><div class="lin"><span>Zoom</span><span class="mono">' + Math.round(lam.zoom * 100) + '%</span></div>' +
        '<input type="range" id="zoom" min="100" max="300" value="' + Math.round(lam.zoom * 100) + '"></div>');
      h.push('<div class="ctrl" data-off="' + (fg.x > 1 ? "0" : "1") + '"><div class="lin"><span>Horizontal</span><span class="mono">' +
        (fg.x > 1 ? Math.round(lam.fx * 100) + "%" : "sem folga") + '</span></div>' +
        '<input type="range" id="fx" min="0" max="100" value="' + Math.round(lam.fx * 100) + '"' + (fg.x > 1 ? "" : " disabled") + "></div>");
      h.push('<div class="ctrl" data-off="' + (fg.y > 1 ? "0" : "1") + '"><div class="lin"><span>Vertical</span><span class="mono">' +
        (fg.y > 1 ? Math.round(lam.fy * 100) + "%" : "sem folga") + '</span></div>' +
        '<input type="range" id="fy" min="0" max="100" value="' + Math.round(lam.fy * 100) + '"' + (fg.y > 1 ? "" : " disabled") + "></div>");
      h.push('<div class="btn-lin"><button class="btn2" id="trocaimg">' + (lam.img ? "Trocar imagem" : "Escolher imagem") + "</button>" +
        (lam.img ? '<button class="btn2 perigo" id="semimg">Remover</button>' : "") + "</div>");
    } else {
      var val = lam[e.sel] || "";
      h.push('<div><div class="rot mono">' + esc(nomeCampo(e.sel).toUpperCase()) + "</div>" +
        '<textarea class="campo" id="txt" rows="' + (e.sel === "corpo" ? 7 : 3) + '">' + esc(val) + "</textarea>" +
        '<p style="margin:7px 0 0;font-size:11.5px;color:var(--mute);line-height:1.45">' +
        "<b class='mono' style='color:#a9afb6'>**destaque**</b> " + esc(
          m.enfase.modo === "cor" ? "pinta o trecho na cor do perfil" :
          m.enfase.modo === "peso" ? "deixa o trecho em negrito" :
          "fica colorido no título e negrito no texto") + "</p></div>");
    }

    h.push('<div id="aviso-slot"></div>');
    if (false)
      h.push('<div class="aviso"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-linecap="round" style="flex:none;margin-top:1px" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        "<div><b>" + esc(nomeCampo(forma(e.marca, lam.tipo) === "capa" ? "titulo" : "corpo")) + " longo demais</b>" +
        "<p>Passou do espaço da lâmina. A fonte vai ser reduzida na exportação.</p></div></div>");

    h.push('<div class="btn-lin"><button class="btn2" id="dup">Duplicar</button>' +
      (e.laminas.length > 1 ? '<button class="btn2 perigo" id="del">Excluir</button>' : "") + "</div>");
    h.push("</div>");
    $("painel").innerHTML = h.join("");
    marcaEstouro();
  }

  /* selo na esteira e aviso no painel, sem refazer nenhum dos dois inteiros
     (refazer o painel mataria o foco de quem está digitando) */
  function marcaEstouro() {
    var lam = e.laminas[e.foco], deve = estourou(lam);
    var q = $("esteira").querySelector('.quadro[data-i="' + e.foco + '"]');
    if (q) {
      var tem = q.querySelector(".alerta");
      if (deve && !tem) { var s2 = document.createElement("span"); s2.className = "alerta"; q.appendChild(s2); }
      if (!deve && tem) tem.remove();
    }
    var slot = $("aviso-slot");
    if (!slot) return;
    if (!deve) { slot.innerHTML = ""; return; }
    var qual = (forma(e.marca, lam.tipo) === "capa") ? "titulo" : "corpo";
    slot.innerHTML = '<div class="aviso"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-linecap="round" style="flex:none;margin-top:1px" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
      "<div><b>" + esc(nomeCampo(qual)) + " longo demais</b>" +
      "<p>Passou do espaço da lâmina. A fonte vai ser reduzida na exportação.</p></div></div>";
  }

  function pinta() {
    var validos = camposDe(e.laminas[e.foco].tipo);
    if (validos.indexOf(e.sel) < 0) e.sel = validos[0];
    $("conta").textContent = e.laminas.length + " / 20 lâminas";
    pintaPerfis(); pintaPalco(); pintaEsteira(); pintaPainel();
  }

  /* ---- eventos ---- */
  document.addEventListener("click", function (ev) {
    var p = ev.target.closest("[data-marca]");
    if (p) { e.marca = p.dataset.marca; semear(); e.sel = null; pinta(); tocar("Perfil: " + M[e.marca].nome); return; }

    var alvo = ev.target.closest(".alvo");
    var lamEl = ev.target.closest(".lam");
    if (alvo && lamEl && lamEl.dataset.foco === "1") { e.sel = alvo.dataset.campo; pinta(); return; }
    if (lamEl) { e.foco = +lamEl.dataset.i; pinta(); return; }

    var q = ev.target.closest(".quadro");
    if (q) { e.foco = +q.dataset.i; pinta(); return; }

    if (ev.target.closest("#add")) {
      var ks = chaves(e.marca), kT = ks.filter(function (k) { return forma(e.marca, k) === "texto"; })[0] || ks[1];
      e.laminas.push({ tipo: kT, titulo: "", sub: "", corpo: "", img: false, zoom: 1, fx: .5, fy: .5, n: String(e.laminas.length) });
      e.foco = e.laminas.length - 1; e.sel = null; pinta(); return;
    }
    if (ev.target.closest("#dup")) {
      var c = Object.assign({}, e.laminas[e.foco]);
      e.laminas.splice(e.foco + 1, 0, c); e.foco++; pinta(); return;
    }
    if (ev.target.closest("#del")) {
      e.laminas.splice(e.foco, 1); if (e.foco >= e.laminas.length) e.foco = e.laminas.length - 1; pinta(); return;
    }
    if (ev.target.closest("#semimg")) { e.laminas[e.foco].img = false; pinta(); return; }
    if (ev.target.closest("#trocaimg")) { e.laminas[e.foco].img = true; pinta(); tocar("Numa versão real isto abre o seletor de arquivo."); return; }
    if (ev.target.closest("#exportar")) { tocar(e.laminas.length + " PNGs de 1080×1350 — no protótipo, só o aviso."); return; }
  });

  document.addEventListener("input", function (ev) {
    var lam = e.laminas[e.foco], id = ev.target.id;
    if (id === "txt" || id === "num") {
      if (id === "txt") lam[e.sel] = ev.target.value; else lam.n = ev.target.value;
      pintaPalco(); marcaEstouro(); return;
    }
    if (id === "zoom" || id === "fx" || id === "fy") {
      if (id === "zoom") lam.zoom = ev.target.value / 100; else lam[id] = ev.target.value / 100;
      pintaPalco(); pintaEsteira();
      var m = M[e.marca], f = forma(e.marca, lam.tipo);
      var im = (f === "capa") ? { w: 1080, h: 1350 } : m.img, fg = folga(lam, im.w, im.h);
      var cx = ev.target.closest(".pbloco");
      cx.querySelectorAll(".ctrl").forEach(function (c) {
        var r = c.querySelector("input"), rot = c.querySelector(".lin span:last-child");
        if (!r) return;
        if (r.id === "zoom") rot.textContent = Math.round(lam.zoom * 100) + "%";
        if (r.id === "fx") { c.dataset.off = fg.x > 1 ? "0" : "1"; r.disabled = !(fg.x > 1); rot.textContent = fg.x > 1 ? Math.round(lam.fx * 100) + "%" : "sem folga"; }
        if (r.id === "fy") { c.dataset.off = fg.y > 1 ? "0" : "1"; r.disabled = !(fg.y > 1); rot.textContent = fg.y > 1 ? Math.round(lam.fy * 100) + "%" : "sem folga"; }
      });
      var pv = cx.querySelector(".foco-img img");
      if (pv) { var g = geo(lam, im.w, im.h), k = 260 / im.w, ky = 112 / (im.h * k);
        pv.style.left = (g.x * k) + "px"; pv.style.top = (g.y * k * ky) + "px";
        pv.style.width = (g.w * k) + "px"; pv.style.height = (g.h * k * ky) + "px"; }
      return;
    }
  });

  document.addEventListener("change", function (ev) {
    if (ev.target.id === "tipo") { e.laminas[e.foco].tipo = ev.target.value; e.sel = null; pinta(); }
  });

  window.addEventListener("resize", function () { pintaPalco(); });

  semear(); pinta();

})();
</script>
